<!-- templates/content.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Payment</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            color: white;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            transition: all 0.4s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .payment-option {
            display: none; /* Hidden by default */
            transition: all 0.4s ease;
        }

        .payment-option.available {
            display: block;
        }

        .payment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .countdown-circle {
            transform: rotate(-90deg);
            transform-origin: center;
            transition: stroke-dashoffset 1s linear;
        }

        .ad-container {
            height: 0;
            opacity: 0;
            transition: all 0.5s ease;
            overflow: hidden;
        }

        .ad-container.show {
            height: auto;
            opacity: 1;
        }

        .payment-section {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .payment-section.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .app-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            transition: transform 0.3s ease;
        }

        .payment-card {
            transition: all 0.3s ease;
            overflow: hidden;
            position: relative;
        }

        .payment-card:hover {
            transform: translateY(-5px);
        }

        .payment-card:hover .app-icon {
            transform: scale(1.1);
        }

        .payment-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
    </style>
</head>
<body class="p-6">
    <!-- Advertisement Section -->
    <div class="ad-container max-w-4xl mx-auto glass-card p-8 mb-8">
        <div class="flex justify-between items-center">
            <div class="space-y-4">
                <h2 class="text-3xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 text-transparent bg-clip-text">
                    Special Offer!
                </h2>
                <p class="text-xl text-gray-300">Get amazing cashback on your first transaction!</p>
                <div class="text-gray-400">Limited time offer. Don't miss out!</div>
            </div>
            
            <div class="relative w-32 h-32">
                <svg class="w-full h-full" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#2a2a2a" stroke-width="8"/>
                    <circle id="countdown-circle" class="countdown-circle" 
                            cx="50" cy="50" r="45" 
                            fill="none" stroke="#6366f1" stroke-width="8"
                            stroke-dasharray="283" stroke-dashoffset="0"/>
                </svg>
                <span id="countdown" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 
                                        text-3xl font-bold">10</span>
            </div>
        </div>
    </div>

    <!-- Payment Section -->
    <div id="paymentSection" class="payment-section max-w-4xl mx-auto">
        <!-- Amount and Merchant Info -->
        <div class="glass-card p-8 mb-8">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-4xl font-bold mb-2">₹{{ amount }}</h1>
                    <p class="text-gray-400">to {{ merchant_name }}</p>
                </div>
                <div class="w-16 h-16 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center">
                    <span class="text-2xl">{{ merchant_name[0] }}</span>
                </div>
            </div>
        </div>

        <!-- Payment Options -->
        <div class="glass-card p-8">
            <h2 class="text-xl font-medium mb-6 text-center text-gray-300">Choose payment method</h2>
            <div class="payment-grid">
                <!-- Google Pay -->
                <div class="payment-option" data-app="gpay">
                    <a href="tez://upi/pay?pa={{ upi_link }}" class="block">
                        <div class="payment-card glass-card p-6">
                            <div class="flex items-center space-x-4">
                                <img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/google-pay-icon.png" 
                                     alt="Google Pay" class="app-icon"/>
                                <div>
                                    <h3 class="font-medium text-lg">Google Pay</h3>
                                    <p class="text-sm text-gray-400">Fast UPI Pay</p>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>

                <!-- PhonePe -->
                <div class="payment-option" data-app="phonepe">
                    <a href="phonepe://pay?pa={{ upi_link }}" class="block">
                        <div class="payment-card glass-card p-6">
                            <div class="flex items-center space-x-4">
                                <img src="https://cdn.freelogovectors.net/wp-content/uploads/2023/11/phonepelogo-freelogovectors.net_.png" 
                                     alt="PhonePe" class="app-icon"/>
                                <div>
                                    <h3 class="font-medium text-lg">PhonePe</h3>
                                    <p class="text-sm text-gray-400">UPI & Wallet</p>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>

                <!-- Paytm -->
                <div class="payment-option" data-app="paytm">
                    <a href="paytmmp://pay?pa={{ upi_link }}" class="block">
                        <div class="payment-card glass-card p-6">
                            <div class="flex items-center space-x-4">
                                <img src="https://raw.githubusercontent.com/hdpngworld/HPW/main/uploads/650d41381232a-l.png" 
                                     alt="Paytm" class="app-icon"/>
                                <div>
                                    <h3 class="font-medium text-lg">Paytm</h3>
                                    <p class="text-sm text-gray-400">UPI Payment</p>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>

                <!-- BHIM -->
                <div class="payment-option" data-app="bhim">
                    <a href="upi://pay?pa={{ upi_link }}" class="block">
                        <div class="payment-card glass-card p-6">
                            <div class="flex items-center space-x-4">
                                <img src="https://openheartcharitabletrust.in/wp-content/uploads/2022/10/3-1024x1024.png" 
                                     alt="BHIM" class="app-icon"/>
                                <div>
                                    <h3 class="font-medium text-lg">BHIM</h3>
                                    <p class="text-sm text-gray-400">UPI Transfer</p>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check for installed apps using iframe method
        function checkAppAvailability() {
            const apps = {
                'gpay': 'tez://',
                'phonepe': 'phonepe://',
                'paytm': 'paytmmp://',
                'bhim': 'upi://'
            };

            for (const [app, scheme] of Object.entries(apps)) {
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                document.body.appendChild(iframe);

                try {
                    iframe.contentWindow.location.href = scheme;
                    const element = document.querySelector(`[data-app="${app}"]`);
                    element.classList.add('available');
                } catch (e) {
                    console.log(`${app} not installed`);
                }

                setTimeout(() => {
                    document.body.removeChild(iframe);
                }, 100);
            }
        }

        // Initialize advertisement and countdown
        function initializeAd() {
            const adContainer = document.querySelector('.ad-container');
            const paymentSection = document.getElementById('paymentSection');
            const countdownElement = document.getElementById('countdown');
            const circle = document.getElementById('countdown-circle');
            const circumference = 2 * Math.PI * 45; // r = 45
            let timeLeft = 10;

            // Show ad container immediately
            adContainer.classList.add('show');
            
            // Start countdown
            const timer = setInterval(() => {
                timeLeft--;
                countdownElement.textContent = timeLeft;
                
                // Update circle animation
                const offset = circumference - (timeLeft / 10) * circumference;
                circle.style.strokeDashoffset = offset;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    
                    // Hide ad and show payment section
                    adContainer.style.opacity = '0';
                    setTimeout(() => {
                        adContainer.style.display = 'none';
                        paymentSection.classList.add('show');
                    }, 500);
                }
            }, 1000);
        }

        // Initialize everything when page loads
        window.onload = () => {
            checkAppAvailability();
            initializeAd();
        };
    </script>
</body>
</html>
