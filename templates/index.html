<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI QR Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            color: white;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            transition: all 0.4s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .input-group {
            position: relative;
            margin-bottom: 2rem;
        }

        .input-group input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .input-group label {
            position: absolute;
            left: 1rem;
            top: 1rem;
            pointer-events: none;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.6);
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            transform: translateY(-1.5rem) scale(0.8);
            color: #6366f1;
        }

        .generate-btn {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            transition: all 0.3s ease;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        #qrcode {
            transition: all 0.5s ease;
        }

        .floating-shapes {
            position: fixed;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(100px, 100px) rotate(360deg); }
        }

        .shimmer {
            position: relative;
            overflow: hidden;
        }

        .shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transform: translateX(-100%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body class="p-6">
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="max-w-2xl mx-auto">
        <div class="glass-card p-8 shimmer">
            <h1 class="text-3xl font-bold mb-8 text-center bg-gradient-to-r from-indigo-400 to-purple-400 text-transparent bg-clip-text">
                Generate Payment QR
            </h1>

            <div class="space-y-6">
                <div class="input-group">
                    <input type="text" id="upi_id" placeholder=" " class="peer">
                    <label for="upi_id">UPI ID</label>
                </div>

                <div class="input-group">
                    <input type="number" id="amount" placeholder=" " class="peer">
                    <label for="amount">Amount (₹)</label>
                </div>

                <div class="input-group">
                    <input type="text" id="merchant_name" placeholder=" " class="peer">
                    <label for="merchant_name">Merchant Name</label>
                </div>

                <button onclick="generateQR()" class="generate-btn w-full py-4 px-6 text-white rounded-lg font-medium text-lg">
                    Generate QR
                </button>
            </div>

            <div id="qrcode" class="mt-8 flex justify-center opacity-0 scale-0"></div>
        </div>
    </div>

    <script>
        // Initialize floating shapes
        function createShapes() {
            const shapes = document.querySelectorAll('.shape');
            shapes.forEach((shape, index) => {
                const size = Math.random() * 300 + 100;
                shape.style.width = `${size}px`;
                shape.style.height = `${size}px`;
                shape.style.left = `${Math.random() * 100}%`;
                shape.style.top = `${Math.random() * 100}%`;
                shape.style.animationDelay = `${index * 2}s`;
            });
        }

        async function generateQR() {
            const upi_id = document.getElementById('upi_id').value;
            const amount = document.getElementById('amount').value;
            const merchant_name = document.getElementById('merchant_name').value;

            // Animate button
            const button = document.querySelector('.generate-btn');
            button.style.transform = 'scale(0.95)';
            setTimeout(() => button.style.transform = 'scale(1)', 100);

            const response = await fetch('/generate-qr', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    upi_id,
                    amount,
                    merchant_name
                }),
            });

            const data = await response.json();
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = `<img src="data:image/png;base64,${data.qr_code}" alt="QR Code" class="rounded-lg shadow-lg">`;
            
            // Animate QR code appearance
            gsap.to("#qrcode", {
                duration: 0.6,
                scale: 1,
                opacity: 1,
                ease: "back.out(1.7)"
            });
        }

        // Initialize
        createShapes();
        
        // Initial animations
        gsap.from(".glass-card", {
            duration: 1,
            y: 50,
            opacity: 0,
            ease: "power3.out"
        });

        gsap.from(".input-group", {
            duration: 0.8,
            y: 20,
            opacity: 0,
            stagger: 0.2,
            ease: "power3.out",
            delay: 0.5
        });
    </script>
</body>
</html>
