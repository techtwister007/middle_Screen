name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/salon_ci
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/salon_test
      PAYLOAD_SECRET: ci-secret-not-for-production
      CUSTOMER_SESSION_SECRET: ci-session-secret
      PUBLIC_URL: http://localhost:3000
      ROOT_DOMAIN: localhost
      EVENTS_MODE: inline
      MESSAGING_PROVIDER: fake
      PAYMENTS_PROVIDER: fake
      IMAGE_AI_PROVIDER: fake
      OTP_FIXED_CODE: '123456'
      # The e2e run starts a production build on localhost: allow the test login code there only,
      # and skip the production config check (no real secrets, storage or providers in CI).
      ALLOW_FIXED_OTP_ON_LOCALHOST: '1'
      SKIP_ENV_CHECK: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'create database salon_ci'
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'create database salon_test'
      - name: Lint
        run: pnpm lint
      - name: Module boundaries
        run: pnpm boundaries
      - name: Typecheck
        run: pnpm -r --filter './packages/*' --filter @salon/platform exec tsc --noEmit
      - name: Unit tests
        run: pnpm --filter @salon/core --filter @salon/modules --filter @salon/themes test
      - name: Integration tests (tenant isolation, journeys, automations, library)
        run: pnpm --filter @salon/platform test
      - name: Migrate and seed
        working-directory: apps/platform
        run: pnpm migrate && pnpm seed
      - name: Build
        working-directory: apps/platform
        run: pnpm build
      - name: End-to-end tests
        working-directory: apps/platform
        run: |
          npx playwright install --with-deps chromium
          (pnpm start > next.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/s/glamnails && break; sleep 2; done
          E2E_BASE_URL=http://localhost:3000 npx playwright test
          node scripts/crawl.mjs http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/platform/test-results
            apps/platform/next.log
