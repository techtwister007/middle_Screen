<title>PropPulse Look</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Hind+Vadodara:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: three phones side by side on desktop; one phone with a screen switch on a phone. Warm paper ground, forest green actions. */
:root{
 --c-bg:#efeae0;--c-ink:#1c2620;--c-ink2:#4a554e;--c-muted:#6b756e;--c-line:rgba(28,38,32,.12);--c-panel:#fbf9f4;--c-sel:#1f4d36;--c-on-sel:#fff;
 --ease:cubic-bezier(.22,1,.36,1);--font:"DM Sans","Hind Vadodara",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-bg:#0c100d;--c-ink:#eef2ec;--c-ink2:#b9c3bc;--c-muted:#8e9a92;--c-line:rgba(238,242,236,.12);--c-panel:#151b17;--c-sel:#cfe6d7;--c-on-sel:#10241a;color-scheme:dark}}
:root[data-theme="dark"]{--c-bg:#0c100d;--c-ink:#eef2ec;--c-ink2:#b9c3bc;--c-muted:#8e9a92;--c-line:rgba(238,242,236,.12);--c-panel:#151b17;--c-sel:#cfe6d7;--c-on-sel:#10241a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--c-bg);color:var(--c-ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit}
:focus-visible{outline:2px solid #2f7a55;outline-offset:2px;border-radius:10px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--c-bg);border-bottom:1px solid var(--c-line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--c-bg)}
.bar-in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;margin-right:auto}
.logo svg{width:26px;height:26px}
.logo span{font-weight:400;color:var(--c-muted);font-size:14px;margin-left:6px}
.seg{display:inline-flex;background:var(--c-panel);border:1px solid var(--c-line);border-radius:12px;padding:3px;gap:2px}
.seg button{height:34px;padding:0 13px;border-radius:9px;font-size:14px;color:var(--c-ink2);transition:background-color .18s var(--ease),color .18s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--c-sel);color:var(--c-on-sel)}
#screens{display:none}
.stage{max-width:1320px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
.cap{font-size:14px;color:var(--c-ink2);font-weight:500}
.device{width:390px;height:844px;border-radius:52px;padding:10px;background:#0b0d0c;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 60px -24px rgba(30,40,30,.35),0 10px 20px -10px rgba(30,40,30,.2);position:relative}
.device::before{content:"";position:absolute;top:20px;left:50%;width:104px;height:30px;margin-left:-52px;background:#0b0d0c;border-radius:20px;z-index:80}
.note{max-width:1320px;margin:0 auto;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--c-muted);font-size:13.5px;text-align:center}
@media (max-width:860px){
 #screens{display:inline-flex}
 .stage{padding:0;gap:0}
 .col{display:none;width:100%}
 .col.on{display:flex}
 .cap{display:none}
 .device{width:100%;height:calc(100dvh - var(--barh,110px));border-radius:0;padding:0;background:none;box-shadow:none}
 .device::before{display:none}
 .logo{width:100%}
}

/* ================= phone tokens ================= */
.ph{
 --bg:#f6f2ea;--card:#ffffff;--raised:#f1ece2;--ink:#1c2620;--ink2:#46524b;--muted:#68736b;--line:rgba(28,38,32,.1);--line2:rgba(28,38,32,.06);
 --g:#1f4d36;--on-g:#ffffff;--g-ink:#1f4d36;--g-soft:#e3eee6;--g-soft-ink:#1d4a33;
 --amber:#9a5a00;--amber-soft:#fbecd2;--wa:#1f8f4e;--red:#c03a3a;
 --sh1:0 1px 2px rgba(28,38,32,.05),0 6px 18px rgba(28,38,32,.06);--sh2:0 2px 4px rgba(28,38,32,.06),0 14px 32px rgba(28,38,32,.1);
 --map-land:#efe9dd;--map-road:#fbf8f2;--map-park:#d6e6d2;--map-water:#cde0ea;--map-block:#e6dfd1;--map-label:#8c8578;
 height:100%;width:100%;border-radius:42px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;isolation:isolate}
.ph.dark{
 --bg:#101511;--card:#18201b;--raised:#212b25;--ink:#eef2ec;--ink2:#c5cec7;--muted:#97a39b;--line:rgba(238,242,236,.11);--line2:rgba(238,242,236,.06);
 --g:#2f7a55;--on-g:#ffffff;--g-ink:#8fd1ad;--g-soft:#1e3328;--g-soft-ink:#a9dcc0;
 --amber:#f2b35a;--amber-soft:#3a2b14;--wa:#3fbf72;--red:#ff7b7b;
 --sh1:0 1px 0 rgba(255,255,255,.03) inset,0 6px 18px rgba(0,0,0,.35);--sh2:0 1px 0 rgba(255,255,255,.04) inset,0 14px 32px rgba(0,0,0,.5);
 --map-land:#18201b;--map-road:#26302a;--map-park:#1d2f23;--map-water:#16262f;--map-block:#1f2823;--map-label:#869088}
@media (max-width:860px){.ph{border-radius:0}}
.ph *{transition:background-color .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease)}
.ph ::selection{background:color-mix(in srgb,var(--g) 30%,transparent)}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scr::-webkit-scrollbar{display:none}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph h1,.ph h2,.ph h3,.ph p{margin:0}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tn{font-variant-numeric:tabular-nums lining-nums}
.sbar{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font:600 15px/1 system-ui,sans-serif;z-index:40;pointer-events:none;color:var(--ink)}
.sbar i{width:24px;height:11px;border-radius:3px;border:1.5px solid currentColor}
.sbar{background:var(--bg)}
.sbar.light{color:#fff;background:transparent}
@media (max-width:860px){.sbar{display:none}}
.pad{padding:0 20px}
.top{padding-top:56px}
@media (max-width:860px){.top{padding-top:14px}}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh1)}
.h2{font-size:18px;font-weight:600;letter-spacing:-.005em}
.btn{height:50px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15.5px;padding:0 18px;transition:transform .14s var(--ease),background-color .25s var(--ease);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-g{background:var(--g);color:var(--on-g);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.btn-o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn-wa{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn-wa .ico{color:var(--wa)}
.circ{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh1);color:var(--ink);transition:transform .14s var(--ease)}
.circ:active{transform:scale(.92)}
.circ[aria-pressed="true"] .ico{fill:var(--red);stroke:var(--red)}
.circ.pop .ico{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.3)}100%{transform:scale(1)}}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--g-soft);color:var(--g-soft-ink);flex:none;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:600}
.chip.hot{background:var(--amber-soft);color:var(--amber)}
.chip.ok{background:var(--g-soft);color:var(--g-soft-ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.tabs{display:flex;gap:6px;background:var(--raised);padding:4px;border-radius:14px}
.tabs button{flex:1;height:38px;border-radius:11px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.enter>*{animation:rise .5s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}
.panel{animation:rise .3s var(--ease) both}
@media (prefers-reduced-motion:reduce){.ph *,.enter>*,.panel{animation:none!important;transition:none!important}}

/* ---------- buyer property page ---------- */
.hero{position:relative;height:330px}
.hero .gal{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hero .gal::-webkit-scrollbar{display:none}
.hero .gal>div{flex:0 0 100%;scroll-snap-align:start}
.hero::after{content:"";position:absolute;inset:0 0 auto;height:130px;background:linear-gradient(rgba(0,0,0,.38),transparent);pointer-events:none}
.agentpill{position:absolute;left:16px;top:56px;z-index:2;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 4px;border-radius:999px;background:rgba(255,255,255,.94);color:#1c2620;font-size:14px;font-weight:600;box-shadow:var(--sh1)}
.agentpill .av{width:32px;height:32px;font-size:12px;background:var(--g);color:#fff}
.hero .acts{position:absolute;right:16px;top:56px;z-index:2;display:flex;gap:8px}
.hero .acts .circ{background:rgba(255,255,255,.94);color:#1c2620}
@media (max-width:860px){.agentpill,.hero .acts{top:14px}}
.cnt{position:absolute;right:16px;bottom:42px;z-index:2;height:26px;padding:0 10px;border-radius:999px;background:rgba(15,20,17,.62);color:#fff;font-size:12.5px;font-weight:600;display:grid;place-items:center}
.sum{position:relative;margin:-28px 12px 0;padding:20px 18px 18px;z-index:3}
.sum h1{font-size:23px;line-height:1.2;font-weight:600;letter-spacing:-.01em}
.sum .loc{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14.5px;margin-top:6px}
.sum .loc .ico{width:16px;height:16px}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:14px}
.price{font-size:30px;font-weight:700;color:var(--g-ink);letter-spacing:-.015em;line-height:1}
.prow small{font-size:13.5px;color:var(--muted)}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.specs div{background:var(--raised);border-radius:14px;padding:12px 8px;text-align:center}
.specs b{display:block;font-size:16px;font-weight:600}
.specs span{font-size:12.5px;color:var(--muted)}
.ver{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:var(--ink2)}
.ver .ico{width:16px;height:16px;color:var(--g-ink)}
.ptabs{position:sticky;top:46px;z-index:10;background:var(--bg);padding:12px 12px 10px;margin-top:8px}
@media (max-width:860px){.ptabs{top:0}}
.ptabs.stuck{box-shadow:0 8px 16px -12px rgba(0,0,0,.25)}
.sec{margin:12px;padding:18px}
.sec .h2{margin-bottom:12px}
.desc{color:var(--ink2);font-size:15px;line-height:1.6}
.hl{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.hl li{display:flex;gap:10px;font-size:14.5px}
.hl .ico{width:18px;height:18px;color:var(--g-ink);margin-top:1px}
.amen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.amen div{background:var(--raised);border-radius:14px;padding:14px 8px;text-align:center;font-size:13px;font-weight:500;display:grid;gap:6px;justify-items:center}
.amen .ico{width:22px;height:22px;color:var(--g-ink)}
.map{border-radius:16px;overflow:hidden;aspect-ratio:16/11;background:var(--map-land)}
.map svg{display:block;width:100%;height:100%}
.near{list-style:none;margin:12px 0 0;padding:0}
.near li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.near li:last-child{border-bottom:0}
.near .ib{width:36px;height:36px;border-radius:11px;background:var(--g-soft);color:var(--g-soft-ink);display:grid;place-items:center;flex:none}
.near .ib .ico{width:18px;height:18px}
.near .nm{flex:1;font-size:14.5px;line-height:1.25}
.near .nm span{display:block;font-size:12.5px;color:var(--muted)}
.near b{font-size:14px;font-weight:600}
.emi .big{font-size:26px;font-weight:700;letter-spacing:-.01em}
.emi .sub{font-size:13.5px;color:var(--muted)}
.sl{margin-top:14px}
.sl .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.sl .lab b{font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(var(--g),var(--g)) 0/var(--p,50%) 100% no-repeat,var(--raised)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--raised)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--g)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--g);box-shadow:0 2px 6px rgba(0,0,0,.2);margin-top:-9px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--g)}
.cost{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:8px;font-size:14px}
.cost div{display:flex;justify-content:space-between}
.cost span:first-child{color:var(--ink2)}
.cost .tot{font-weight:600}
.cost .tot span:first-child{color:var(--ink)}
.agent{display:flex;gap:12px;align-items:center}
.agent .av{width:52px;height:52px;background:var(--g);color:#fff;font-size:17px}
.agent b{display:block;font-size:16px;font-weight:600}
.agent span{font-size:13.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.foot{padding:20px 20px 116px;font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between}
.foot a{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.foot .h{color:var(--red)}
.bb{position:absolute;left:12px;right:12px;bottom:12px;z-index:20;display:grid;grid-template-columns:50px 1fr 1.2fr;gap:8px;padding:8px;border-radius:22px;background:var(--card);box-shadow:var(--sh2);transition:transform .3s var(--ease)}
.bb.hid{transform:translateY(130%)}
.bb .heart{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center}
.bb .heart[aria-pressed="true"] .ico{fill:var(--red);stroke:var(--red)}
.bb .heart.pop .ico{animation:pop .45s var(--ease)}

/* sheet */
.scrim{position:absolute;inset:0;z-index:30;background:rgba(10,14,11,.45);opacity:0;pointer-events:none;transition:opacity .22s var(--ease)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 20px 20px;transform:translateY(102%);transition:transform .2s cubic-bezier(.4,0,1,1)}
.ph.dim .scrim{opacity:1;pointer-events:auto}
.ph.dim .sheet{transform:none;transition:transform .45s var(--ease)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:19px;font-weight:600}
.sheet .muted{font-size:14px;color:var(--muted);margin-top:2px}
.q{font-size:14px;font-weight:600;margin:18px 0 8px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{height:66px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;place-content:center;text-align:center}
.day span{font-size:12.5px;color:var(--muted)}
.day b{font-size:20px;font-weight:600}
.day[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:var(--on-g)}
.day[aria-pressed="true"] span{color:rgba(255,255,255,.8)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.slot[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:var(--on-g)}
.ta{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font-size:14.5px}
.ta::placeholder{color:var(--muted)}
.okv{text-align:center;padding:18px 0 4px}
.okv svg{width:64px;height:64px;margin:0 auto 12px;display:block}
.okv path{stroke-dasharray:44;stroke-dashoffset:44;animation:draw .55s .1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- agent home ---------- */
.hello{display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.hello p{font-size:14px;color:var(--muted)}
.hello h1{font-size:24px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.hello .r{display:flex;gap:10px;align-items:center}
.bell{position:relative}
.bell i{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
.quick{margin:20px 16px 0;padding:16px}
.quick .h2{font-size:16px;margin-bottom:14px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qa button{display:grid;justify-items:center;gap:8px;font-size:12.5px;font-weight:500;line-height:1.25;text-align:center;padding:4px 0}
.qa .ib{width:52px;height:52px;border-radius:16px;background:var(--g-soft);color:var(--g-soft-ink);display:grid;place-items:center;transition:transform .14s var(--ease)}
.qa button:active .ib{transform:scale(.94)}
.qa .ib .ico{width:22px;height:22px}
.wa-tip{text-align:left;width:calc(100% - 32px);margin:12px 16px 0;padding:14px 16px;display:flex;gap:12px;align-items:center;border-radius:20px;background:var(--g);color:var(--on-g)}
.wa-tip .ico{width:22px;height:22px}
.wa-tip p{font-size:14px;line-height:1.35}
.wa-tip b{font-weight:600;display:block;font-size:15px}
.wa-tip .chev{margin-left:auto;opacity:.8}
.secth{display:flex;justify-content:space-between;align-items:baseline;padding:0 20px;margin:26px 0 10px}
.secth a,.secth button{font-size:14px;font-weight:600;color:var(--g-ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.stats div{padding:14px 14px 12px}
.stats b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}
.stats small{display:block;font-size:12px;color:var(--g-ink);font-weight:600;margin-top:4px}
.att{margin:0 16px;padding:4px 16px}
.att button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line2)}
.att button:last-child{border-bottom:0}
.att .t{flex:1;min-width:0}
.att b{display:block;font-size:15px;font-weight:600}
.att span{font-size:13.5px;color:var(--muted)}
.att time{font-size:12.5px;color:var(--muted);white-space:nowrap}
.att .chev{color:var(--muted)}
.att .av.ic{background:var(--amber-soft);color:var(--amber)}
.nav{position:absolute;left:12px;right:12px;bottom:12px;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:22px;background:var(--card);box-shadow:var(--sh2)}

 $$('[data-p]',ph).forEach(b=>b.onclick=()=>setPane(b.dataset.p));wireEmi(ph);

 const calc=()=>{const L=PRICE*lp.value/100,n=tn.value*12,r=rt.value/1200,e=L*r*(1+r)**n/((1+r)**n-1);
  $('#emiv',ph).textContent='₹'+inr(e);$('#emis',ph).textContent=`per month for ${tn.value} years`;$('#lv',ph).textContent=`${short(L)} (${lp.value}%)`;$('#tv',ph).textContent=`${tn.value} years`;$('#rv',ph).textContent=`${(+rt.value).toFixed(1)}%`;
  [lp,tn,rt].forEach(s=>s.style.setProperty('--p',(s.value-s.min)/(s.max-s.min)*100+'%'))};
 [lp,tn,rt].forEach(s=>s.oninput=calc);calc();
}
